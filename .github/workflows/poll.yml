
name: Radio Metadata Poller
 
on:
  schedule:
    # Minimum réaliste sur GitHub Actions ~5 min (peut être retardé sous charge)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
 
jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Poll radio streams
        run: node poll-radios.mjs
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          RADIO_POLL_SECRET: ${{ secrets.RADIO_POLL_SECRET }}
 
