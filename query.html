<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Historique de diffusion radio</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  select, input {
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  #config-url {
    width: 100%;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--muted); font-weight: 500; }
  .cover {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    object-fit: cover;
    background: #262b36;
  }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<h1>🎙️ Historique de diffusion — Europe 2 / RFM / NRJ / Nostalgie / Chérie FM / Fun Radio / RTL2</h1>

<div class="panel">
  <label for="config-url">URL du Web App Apps Script (déployée)</label>
  <input id="config-url" type="url" placeholder="https://script.google.com/macros/s/AKfycb.../exec" />
</div>

<div class="panel">
  <div class="row">
    <div>
      <label for="station">Station</label>
      <select id="station">
        <option value="">Toutes</option>
        <option>Europe 2</option>
        <option>Europe 1</option>
        <option>RFM</option>
        <option>NRJ</option>
        <option>Nostalgie</option>
        <option>Chérie FM</option>
        <option>Fun Radio</option>
        <option>RTL2</option>
      </select>
    </div>
    <div>
      <label for="from">Du</label>
      <input id="from" type="datetime-local" />
    </div>
    <div>
      <label for="to">Au</label>
      <input id="to" type="datetime-local" />
    </div>
    <div>
      <button id="search-btn">Rechercher</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="panel">
  <table>
    <thead>
      <tr>
        <th></th>
        <th>Horodatage</th>
        <th>Station</th>
        <th>Artiste</th>
        <th>Titre</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</div>

<script>
  const coverCache = new Map();

  function getConfigUrl() {
    const url = document.getElementById('config-url').value.trim();
    localStorage.setItem('radiotracker_webapp_url', url); // OK ici (page hors artifact Claude.ai)
    return url;
  }

  window.addEventListener('load', () => {
    const saved = localStorage.getItem('radiotracker_webapp_url');
    if (saved) document.getElementById('config-url').value = saved;
  });

  async function fetchCover(webAppUrl, artiste, titre) {
    const key = `${artiste}|||${titre}`;
    if (coverCache.has(key)) return coverCache.get(key);
    try {
      const url = `${webAppUrl}?action=cover&artiste=${encodeURIComponent(artiste || '')}&titre=${encodeURIComponent(titre || '')}`;
      const resp = await fetch(url);
      const json = await resp.json();
      const cover = json.ok ? json.cover : null;
      coverCache.set(key, cover);
      return cover;
    } catch {
      return null;
    }
  }

  async function search() {
    const webAppUrl = getConfigUrl();
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    if (!webAppUrl) {
      statusEl.textContent = "Renseigne d'abord l'URL du Web App Apps Script.";
      return;
    }

    const station = document.getElementById('station').value;
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;

    const params = new URLSearchParams();
    if (station) params.set('station', station);
    if (from) params.set('from', from);
    if (to) params.set('to', to);

    statusEl.textContent = 'Recherche en cours...';
    resultsEl.innerHTML = '';

    try {
      const resp = await fetch(`${webAppUrl}?${params.toString()}`);
      const json = await resp.json();

      if (!json.ok) {
        statusEl.textContent = `Erreur: ${json.error}`;
        return;
      }

      const rows = json.rows || [];
      statusEl.textContent = `${rows.length} diffusion(s) trouvée(s).`;

      // Affiche d'abord les lignes sans pochette, charge les pochettes ensuite
      rows.forEach((row) => {
        const [horodatage, st, artiste, titre] = row;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img class="cover" id="cover-${btoa(unescape(encodeURIComponent(horodatage + st + titre))).replace(/[^a-zA-Z0-9]/g, '')}" /></td>
          <td>${new Date(horodatage).toLocaleString('fr-FR')}</td>
          <td>${st}</td>
          <td>${artiste || ''}</td>
          <td>${titre || ''}</td>
        `;
        resultsEl.appendChild(tr);

        const imgId = `cover-${btoa(unescape(encodeURIComponent(horodatage + st + titre))).replace(/[^a-zA-Z0-9]/g, '')}`;
        fetchCover(webAppUrl, artiste, titre).then((cover) => {
          const img = document.getElementById(imgId);
          if (img && cover) img.src = cover;
        });
      });
    } catch (err) {
      statusEl.textContent = `Erreur réseau: ${err.message}`;
    }
  }

  document.getElementById('search-btn').addEventListener('click', search);
</script>

</body>
</html>
